<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小程序首页等效预览</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#2B2F36;
  font-family:system-ui,-apple-system,sans-serif;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;padding:20px;
}
.shell{
  width:430px;height:min(860px,calc(100vh - 40px));
  background:#F1F8F7;border-radius:28px;overflow:hidden;
  position:relative;display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,0.45);
}
/* 顶部状态栏（模拟小程序胶囊所在区域） */
.status-bar{
  height:44px;background:#F1F8F7;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;color:#1D2129;font-size:15px;font-weight:600;
}
.status-time{letter-spacing:0.5px;}
.status-icons{display:flex;align-items:center;gap:6px;}
.status-icons svg{width:17px;height:17px;stroke:#1D2129;fill:none;stroke-width:1.6;}

/* 内容滚动区 */
.content{flex:1;overflow-y:auto;position:relative;}

/* ---- 复刻小程序 pages/index ---- */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px 12px;
}
.left-group{display:flex;align-items:center;}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#35B9AA,#0F9487);
  display:flex;align-items:center;justify-content:center;
  font-size:13.8px;color:#fff;font-weight:600;
}
.username{font-size:16px;font-weight:700;color:#1D2129;margin-left:8px;}
.nickname{
  font-size:12px;color:#86909C;background:#F2F3F5;
  padding:1.7px 8px;border-radius:9.7px;margin-left:4px;
}
.capsule{
  width:70px;height:28px;border:1px solid rgba(0,0,0,0.08);border-radius:14px;
  background:#FFFFFF;display:flex;align-items:center;flex-shrink:0;
  opacity:0.55;
}
.capsule-dot{width:8px;height:8px;border-radius:50%;background:#C9CDD4;margin-left:12px;}
.capsule-line{width:1px;height:14px;background:#E5E6EB;margin:0 10px;}
.capsule-circle{width:14px;height:14px;border-radius:50%;border:1.5px solid #C9CDD4;margin-right:8px;}

.banner{margin:0 16px;border-radius:16px;position:relative;overflow:hidden;}
.banner-swiper{width:100%;}
.banner-slide-img{width:100%;height:160px;object-fit:cover;display:block;}
.banner-track{display:flex;transition:transform .4s ease;}
.banner-slide{min-width:100%;position:relative;}
.banner-dots{
  display:flex;justify-content:center;gap:5.7px;
  position:absolute;bottom:12px;left:0;right:0;z-index:2;
}
.banner-dot{width:5.7px;height:5.7px;border-radius:50%;background:rgba(255,255,255,0.5);cursor:pointer;transition:all .3s;}
.banner-dot.active{background:#fff;width:17.8px;border-radius:2.9px;}

.banner-fallback{
  padding:20px 17.8px;
  background:linear-gradient(135deg,#0F9487 0%,#35B9AA 60%,#BEEFDA 100%);
  position:relative;overflow:hidden;
}
.banner-fallback::before{
  content:'';position:absolute;top:-30%;right:-20%;width:180px;height:180px;
  background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);
  border-radius:50%;
}
.banner-content{position:relative;z-index:1;}
.banner-illustration{
  display:flex;align-items:flex-end;justify-content:center;
  margin-bottom:13.7px;gap:8px;min-height:56px;
}
.illus-book{
  width:36px;height:28px;
  background:linear-gradient(135deg,rgba(255,255,255,0.9),rgba(255,255,255,0.7));
  border-radius:6px 6px 0 0;position:relative;
}
.illus-book::after{
  content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:7px solid transparent;border-right:7px solid transparent;
  border-bottom:12px solid rgba(255,255,255,0.9);
}
.illus-people{display:flex;gap:3px;align-items:flex-end;}
.illus-person{
  width:7px;height:20px;
  background:linear-gradient(180deg,rgba(255,255,255,0.8),rgba(255,255,255,0.5));
  border-radius:4px 4px 0 0;
}
.illus-person.tall{height:26px;}
.illus-person.med{height:20px;}
.banner-title{font-size:17.8px;font-weight:700;color:#FFFFFF;text-align:center;margin-bottom:5.7px;}
.banner-sub{font-size:13.7px;color:rgba(255,255,255,0.85);text-align:center;}

.quick-actions{display:flex;padding:5.7px 16px;margin-top:16px;}
.action-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
  cursor:pointer;position:relative;padding:4px 0;
}
.action-icon{width:48px;height:48px;position:relative;}
.action-icon img{width:48px;height:48px;object-fit:contain;display:block;}
.action-label{font-size:13.8px;color:#1D2129;font-weight:700;}
.badge{
  position:absolute;top:-5.7px;right:-5.7px;
  min-width:17.8px;height:17.8px;background:#FF6A1A;color:#fff;
  font-size:9.7px;font-weight:700;border-radius:9px;
  display:flex;align-items:center;justify-content:center;padding:0 5px;z-index:2;
}

.feature-zone{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
  padding:0 16px;margin:24px 0 20px;
}
.feature-left{
  grid-row:span 2;height:192px;
  background:linear-gradient(135deg,#0F9487 0%,#35B9AA 50%,#BEEFDA 100%);
  border-radius:16px;padding:20px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
  cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.feature-left::before{
  content:'';position:absolute;top:-20%;right:-20%;width:160px;height:160px;
  background:radial-gradient(circle,rgba(255,255,255,0.12) 0%,transparent 70%);
  border-radius:50%;
}
.feature-left-title{font-size:20px;font-weight:700;color:#FFFFFF;position:relative;z-index:1;}
.feature-left-sub{font-size:13px;color:rgba(255,255,255,0.75);margin-top:6px;position:relative;z-index:1;}
.feature-left-btn{
  align-self:flex-start;padding:8px 12px;background:#0F9487;color:#fff;
  border-radius:20px;font-size:14px;font-weight:600;position:relative;z-index:1;
}
.feature-right{
  background:rgba(20,168,154,0.06);
  border-radius:16px;padding:20px 16px;
  box-shadow:0 2px 8px rgba(0,0,0,0.04);
  cursor:pointer;position:relative;overflow:hidden;
}
.feature-right-title{
  font-size:20px;font-weight:700;color:#0B6D55;
  display:flex;align-items:center;justify-content:space-between;
}
.feature-right-sub{font-size:12px;color:#86909C;margin-top:6px;}
.feature-dot{width:8px;height:8px;background:#FF6A1A;border-radius:50%;}

.my-classes{padding:0 16px 100px;}
.section-title{font-size:24px;font-weight:700;color:#1D2129;margin-bottom:14px;margin-left:14px;}
.empty-tip{text-align:center;padding:40px 0;color:#86909C;font-size:14px;}
.class-card{
  background:#FFFFFF;border-radius:16px;padding:18px 16px 16px;
  margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);cursor:pointer;
}
.class-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.class-name-group{display:flex;align-items:center;}
.class-name{font-size:18px;font-weight:700;color:#1D2129;}
.class-tag{
  font-size:12px;color:#14A89A;background:rgba(20,168,154,0.08);
  padding:3px 10px;border-radius:10px;margin-left:8px;
}
.arrow-icon{width:20px;height:20px;color:#86909C;font-size:22px;display:flex;align-items:center;justify-content:center;}
.class-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;}
.stat-item{text-align:center;}
.stat-value{font-size:18px;font-weight:700;color:#1D2129;}
.stat-unit{font-size:14px;font-weight:400;color:#4E5969;margin-left:2px;}
.stat-label{font-size:12px;color:#86909C;margin-top:3px;}

/* ---- 底部原生 tabBar 模拟 ---- */
.tabbar{
  flex-shrink:0;background:#FFFFFF;border-top:1px solid #E5E6EB;
  display:flex;justify-content:space-around;align-items:center;
  padding:6px 0;position:relative;z-index:10;
}
.tab-item{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;position:relative;padding:2px 20px;
}
.tab-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.tab-icon svg{width:22px;height:22px;}
.tab-label{font-size:12px;font-weight:500;color:#86909C;}
.tab-item.active .tab-label{color:#14A89A;}
.tab-item.active .tab-icon svg{stroke:#14A89A;fill:rgba(20,168,154,0.08);}
.tab-badge{
  position:absolute;top:-2px;right:10px;min-width:18px;height:18px;
  background:#FF6A1A;color:#fff;font-size:10px;font-weight:700;
  border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;
}
.toast{
  position:absolute;left:50%;top:40%;transform:translateX(-50%);
  background:rgba(0,0,0,.75);color:#fff;padding:12px 20px;border-radius:10px;
  font-size:14px;z-index:99;white-space:nowrap;
}
</style>
</head>
<body>
<div class="shell">
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 24 24"><rect x="2" y="7" width="4" height="11" rx="1.2"/><rect x="8" y="4" width="4" height="14" rx="1.2"/><rect x="14" y="9" width="4" height="9" rx="1.2"/><rect x="20" y="5" width="3" height="13" rx="1.2"/></svg>
      <svg viewBox="0 0 24 24"><rect x="3" y="10" width="4" height="8" rx="1"/><rect x="9" y="6" width="4" height="12" rx="1"/><rect x="15" y="2" width="4" height="16" rx="1"/></svg>
      <svg viewBox="0 0 24 24" fill="#1D2129" stroke="none"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm3 10h-2v6h-2v-6H9V8h2V6h2v2h2v4z" transform="scale(0.8) translate(3,3)"/></svg>
    </div>
  </div>

  <div class="content">
    <div class="top-bar">
      <div class="left-group">
        <div class="avatar">陈</div>
        <span class="username">陈小武</span>
        <span class="nickname">小武</span>
      </div>
      <div class="capsule">
        <div class="capsule-dot"></div>
        <div class="capsule-line"></div>
        <div class="capsule-circle"></div>
      </div>
    </div>

    <div class="banner" id="bannerContainer">
      <div class="banner-fallback">
        <div class="banner-content">
          <div class="banner-illustration">
            <div class="illus-book"></div>
            <div class="illus-people">
              <div class="illus-person tall"></div>
              <div class="illus-person med"></div>
              <div class="illus-person tall"></div>
            </div>
          </div>
          <div class="banner-title">高校学生教育发展大会</div>
          <div class="banner-sub">2024年10月 · 学术报告厅</div>
        </div>
      </div>
    </div>

    <div class="quick-actions">
      <div class="action-item"><div class="action-icon"><img src="imgs/icon-search.webp" alt="学生查询"></div><span class="action-label">学生查询</span></div>
      <div class="action-item"><div class="action-icon"><img src="imgs/icon-attendance.webp" alt="发起考勤"></div><span class="action-label">发起考勤</span></div>
      <div class="action-item"><div class="action-icon"><img src="imgs/icon-score.webp" alt="发起评分"></div><span class="action-label">发起评分</span></div>
      <div class="action-item"><div class="action-icon"><span class="badge">5</span><img src="imgs/icon-approval.webp" alt="我的审批"></div><span class="action-label">我的审批</span></div>
    </div>

    <div class="feature-zone" id="featureZone"></div>

    <div class="my-classes">
      <div class="section-title">我的班级</div>
      <div id="classList"></div>
    </div>
  </div>

  <div class="tabbar">
    <div class="tab-item active">
      <div class="tab-icon"><svg viewBox="0 0 24 24" fill="rgba(20,168,154,0.08)" stroke="#14A89A" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/></svg></div>
      <span class="tab-label">班级组织</span>
    </div>
    <div class="tab-item">
      <span class="tab-badge">5</span>
      <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="4"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
      <span class="tab-label">工作台</span>
    </div>
    <div class="tab-item">
      <div class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#86909C" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-8 8-8s8 4 8 8"/></svg></div>
      <span class="tab-label">我的</span>
    </div>
  </div>

  <div class="toast" id="toast" style="display:none"></div>
</div>

<script>
(function(){
  var currentIndex=0,timer=null;
  function buildCarousel(banners){
    var container=document.getElementById('bannerContainer');
    if(!banners||banners.length===0){
      container.innerHTML='<div class="banner-fallback"><div class="banner-content"><div class="banner-illustration"><div class="illus-book"></div><div class="illus-people"><div class="illus-person tall"></div><div class="illus-person med"></div><div class="illus-person tall"></div></div></div><div class="banner-title">高校学生教育发展大会</div><div class="banner-sub">2024年10月 · 学术报告厅</div></div></div>';
      return;
    }
    if(banners.length===1){
      container.innerHTML='<div class="banner-slide"><img class="banner-slide-img" src="'+banners[0].image_url+'" alt="'+banners[0].title+'" style="height:160px;object-fit:cover;border-radius:16px;width:100%;display:block;"></div>';
      return;
    }
    var slides=banners.map(function(b){return '<div class="banner-slide" style="min-width:100%"><img class="banner-slide-img" src="'+b.image_url+'" alt="'+b.title+'"></div>';}).join('');
    var dots='<div class="banner-dots">'+banners.map(function(_,i){return '<div class="banner-dot'+(i===0?' active':'')+'" data-idx="'+i+'"></div>';}).join('')+'</div>';
    container.innerHTML='<div class="banner-swiper"><div class="banner-track" id="bannerTrack">'+slides+'</div>'+dots+'</div>';
    var track=document.getElementById('bannerTrack');
    function goTo(idx){
      currentIndex=idx;
      track.style.transform='translateX(-'+(idx*100)+'%)';
      var dotsEl=document.querySelectorAll('.banner-dot');
      for(var i=0;i<dotsEl.length;i++){dotsEl[i].classList.toggle('active',i===idx);}
    }
    var dotEls=document.querySelectorAll('.banner-dot');
    for(var d=0;d<dotEls.length;d++){
      dotEls[d].addEventListener('click',function(){
        goTo(parseInt(this.dataset.idx));resetTimer();
      });
    }
    function resetTimer(){clearInterval(timer);timer=setInterval(function(){currentIndex=(currentIndex+1)%banners.length;goTo(currentIndex);},3000);}
    resetTimer();
  }
  fetch('/api/banners/enabled').then(function(r){return r.json();}).then(buildCarousel).catch(function(){});

  function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function openCard(key){
    if(key==='score_report'){location.href='score-exam-preview.html';return;}
    var t=document.getElementById('toast');
    t.innerText='功能开发中';t.style.display='block';
    setTimeout(function(){t.style.display='none';},1500);
  }
  document.getElementById('featureZone').addEventListener('click',function(e){
    var card=e.target.closest('[data-key]');
    if(card)openCard(card.dataset.key);
  });
  function loadFeatureCards(){
    fetch('/api/feature-cards/enabled').then(function(r){return r.json();}).then(function(cards){
      if(!cards||cards.length===0)return;
      cards.sort(function(a,b){return a.sort_order-b.sort_order;});
      var zone=document.getElementById('featureZone');
      var html='';
      for(var i=0;i<cards.length;i++){
        var c=cards[i];
        var bgStyle=c.image_url?'background-image:url('+c.image_url+');background-size:cover;background-position:center;':'';
        if(i===0){
          html+='<div class="feature-left" data-key="'+c.card_key+'" style="'+bgStyle+'"><div><div class="feature-left-title">'+escapeHtml(c.title)+'</div>'+(c.subtitle?'<div class="feature-left-sub">'+escapeHtml(c.subtitle)+'</div>':'')+'</div><button class="feature-left-btn">去体验</button></div>';
        }else{
          var dot=c.card_key==='notice_board'?'<span class="feature-dot"></span>':'';
          html+='<div class="feature-right" data-key="'+c.card_key+'" style="'+bgStyle+'"><div class="feature-right-title">'+escapeHtml(c.title)+dot+'</div>'+(c.subtitle?'<div class="feature-right-sub">'+escapeHtml(c.subtitle)+'</div>':'')+'</div>';
        }
      }
      zone.innerHTML=html;
    }).catch(function(){});
  }
  loadFeatureCards();

  function classCardHtml(c,s){
    var teachRateText=s.has_teaching?(s.teach_rate+'<span class="stat-unit">%</span>'):'暂无';
    var exerRateText=s.has_exercise?(s.exer_rate+'<span class="stat-unit">%</span>'):'暂无';
    return '<div class="class-card"><div class="class-header"><div class="class-name-group"><span class="class-name">'+escapeHtml(c.name)+'</span>'+(c.type?'<span class="class-tag">'+escapeHtml(c.type)+'</span>':'')+'</div><span class="arrow-icon">&#8250;</span></div><div class="class-stats"><div class="stat-item"><span class="stat-value">'+(c.student_count||0)+'<span class="stat-unit">人</span></span><span class="stat-label">学生人数</span></div><div class="stat-item"><span class="stat-value">'+teachRateText+'</span><span class="stat-label">今日出勤</span></div><div class="stat-item"><span class="stat-value">'+exerRateText+'</span><span class="stat-label">今日出操</span></div><div class="stat-item"><span class="stat-value">'+s.leave_total+'<span class="stat-unit">人</span></span><span class="stat-label">今日请假</span></div></div></div>';
  }
  function renderClasses(classes,summaries){
    var index={};
    for(var s=0;s<summaries.length;s++){index[summaries[s].class_id]=summaries[s];}
    var html='';
    for(var i=0;i<classes.length;i++){
      var c=classes[i];
      var s=index[c.id]||{has_teaching:false,teach_rate:0,has_exercise:false,exer_rate:0,leave_total:0};
      html+=classCardHtml(c,s);
    }
    document.getElementById('classList').innerHTML=html||'<div class="empty-tip">暂无班级</div>';
  }
  function loadClasses(){
    fetch('/api/public/classes?teacher_id=2').then(function(r){return r.json();}).then(function(classes){
      fetch('/api/public/attendance-summary').then(function(r){return r.json();}).then(function(summaries){
        renderClasses(classes,summaries||[]);
      }).catch(function(){
        renderClasses(classes,[]);
      });
    }).catch(function(){
      document.getElementById('classList').innerHTML='<div class="empty-tip">暂无班级</div>';
    });
  }
  loadClasses();
})();
</script>
</body>
</html>
